name: Update profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  update-profile-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate normalized snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PROFILE_LOGIN: themadjocker
        run: python scripts/update_profile_data.py

      - name: Render telemetry SVG
        run: python scripts/render_telemetry.py

      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/profile-data.json assets/telemetry/github-telemetry.svg
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: update GitHub profile telemetry"
            git push
          fi
